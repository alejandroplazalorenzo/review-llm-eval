[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "review-llm-eval"
version = "0.1.0"
description = "Classify Spanish hotel reviews with a local LLM under a JSON Schema and measure how reliable the output is."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro Plaza Lorenzo" }]
dependencies = [
    "requests>=2.31",
    "jsonschema>=4.20",
    "pyarrow>=15",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
