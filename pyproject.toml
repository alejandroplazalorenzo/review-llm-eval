[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "review-llm-eval"
version = "0.2.0"
description = "Review enrichment with a local LLM (Ollama, JSON Schema) plus a sentiment layer, re-measured on public Spanish hotel reviews."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro Plaza Lorenzo" }]
dependencies = [
    "requests>=2.31",
    "jsonschema>=4.20",
    "pyarrow>=15",
    "truststore>=0.9",
]

[project.optional-dependencies]
# Layer 1 (sentiment and emotion). Heavy (torch, transformers); not needed for the tests.
layer1 = [
    "pysentimiento>=0.7",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The prompt is data: wrapping its lines would change what the model reads.
"src/review_llm_eval/prompt.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
